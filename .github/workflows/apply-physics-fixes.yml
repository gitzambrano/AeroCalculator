name: apply-physics-fixes

on:
  push:
    branches: [Full-documentation]
    paths:
      - '.github/workflows/apply-physics-fixes.yml'
      - 'tools/apply_physics_fixes.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Full-documentation
          fetch-depth: 0

      - name: Apply deterministic physics corrections
        run: python tools/apply_physics_fixes.py

      - name: Run full portable verification
        run: python tests/run_all_tests.py

      - name: Run repository sanity
        run: python tools/check_repo.py

      - name: Commit corrected source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AeroCalculator.b4a CHANGELOG.md docs tests
          git diff --cached --check
          git commit -m "fix: correct remaining physics and numerical paths"
          git push origin HEAD:Full-documentation
