name: apply-edge-to-edge-fix

on:
  push:
    branches:
      - release/3.22
    paths:
      - .github/workflows/apply-edge-to-edge-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.22

      - name: Apply safe-area layout fix
        shell: python
        run: |
          from pathlib import Path
          import re

          main = Path("AeroCalculator.b4a")
          s = main.read_text(encoding="utf-8-sig")

          old = "\t'Popup Menu\n\tDim PopupMenu As RSPopupMenu\n\t\nEnd Sub"
          new = "\t'Popup Menu\n\tDim PopupMenu As RSPopupMenu\n\n\t'Android edge-to-edge safe content root\n\tDim root As Panel\n\tDim imeInsets As IME\n\t\nEnd Sub"
          assert old in s
          s = s.replace(old, new, 1)

          needle = "Sub Activity_Create(FirstTime As Boolean)\n\t\t\t\n"
          assert needle in s
          s = s.replace(needle, needle + "\t'Keep the complete application UI inside the system-bar-safe content area.\n\timeInsets.Initialize(\"imeInsets\")\n\troot.Initialize(\"\")\n\tDim Content As Rect = imeInsets.GetContentRect\n\tActivity.AddView(root, Content.Left, Content.Top, Content.Width, Content.Height)\n\timeInsets.UpdatePercentageReference(root.Width, root.Height)\n\n", 1)

          pat = re.compile(r"\n\t' Tamanho e numero de paineis de inputs\n\tib = 8dip\n\ttb = 40dip\t\n\tDim PanelNb As Int  \n\tPanelNb = 14\n\t\n\t' Escalonamento com tamanho do celular\n\tDim hh, yy As Double\n\thh = 99dip \+ PanelNb \* \(ib \* 2 \+ tb\) \+ PanelNb \* 1dip \+ 1dip\n\tyy = Activity.Height\n\txx = Activity.Width\n\t\n\tsc = yy / hh\n\tIf sc<1 Then\n\t\tsc=1\n\tEnd If\n\tIf Activity.Width > Activity.Height Then\n\t\tld = 1\n\tElse\n\t\tld = 0\n\tEnd If\n", re.M)
          m = pat.search(s)
          assert m
          s = s[:m.start()] + "\n" + s[m.end():]

          marker = "\tEnd If\n\t\n\t'Criando pagina de Airplanes"
          assert marker in s
          block = "\tEnd If\n\n\t'Color shown behind transparent system bars on edge-to-edge Android versions.\n\tActivity.Color = ColorPnlTitle\n\troot.Color = ColorPnlInput5\n\n\t'Tamanho e numero de paineis de inputs\n\tib = 8dip\n\ttb = 40dip\n\tDim PanelNb As Int\n\tPanelNb = 14\n\n\t'Escalonamento com a area util (exclui status/navigation bars).\n\tDim hh, yy As Double\n\thh = 99dip + PanelNb * (ib * 2 + tb) + PanelNb * 1dip + 1dip\n\tyy = root.Height\n\txx = root.Width\n\n\tsc = yy / hh\n\tIf sc<1 Then\n\t\tsc=1\n\tEnd If\n\tIf root.Width > root.Height Then\n\t\tld = 1\n\tElse\n\t\tld = 0\n\tEnd If\n\t\n\t'Criando pagina de Airplanes"
          s = s.replace(marker, block, 1)

          replacements = {
              "pnlBack0.AddView(scvMain0, 0, 0, 100%x, 100%y-100dip)": "pnlBack0.AddView(scvMain0, 0, 0, root.Width, root.Height-102dip*sc)",
              "pnlBack1.AddView(scvMain1, 0, 0, 100%x, 100%y-100dip)": "pnlBack1.AddView(scvMain1, 0, 0, root.Width, root.Height-102dip*sc)",
              "pnlBack2.AddView(scvMain2, 0, 0, 100%x, 100%y-100dip*sc)": "pnlBack2.AddView(scvMain2, 0, 0, root.Width, root.Height-102dip*sc)",
              "Activity.AddView(pnltitle, 0, 0, 100%x, 102dip*sc)": "root.AddView(pnltitle, 0, 0, root.Width, 102dip*sc)",
              "Activity.AddView(pager, 0, 102dip*sc, Activity.Width, Activity.Height-98dip*sc)": "root.AddView(pager, 0, 102dip*sc, root.Width, root.Height-102dip*sc)",
              "Activity.AddView(pnlT, 90%x, 0, 9%x, 34dip*sc)": "root.AddView(pnlT, 90%x, 0, 9%x, 34dip*sc)",
              "If Activity.Width > Activity.Height Then": "If root.Width > root.Height Then",
              "pnl.AddView(lbl1, 5dip, 10dip, 100%x, 30dip)": "pnl.AddView(lbl1, 5dip, 10dip, root.Width-5dip, 30dip)",
              "Activity.Width-1.0*He": "root.Width-1.0*He",
          }
          for a, b in replacements.items():
              assert a in s, a
              s = s.replace(a, b)
          main.write_text(s, encoding="utf-8-sig")

          airp = Path("Airp.bas")
          s = airp.read_text(encoding="utf-8-sig")
          old = "\tDim ID As Int\n\t\n\t\nEnd Sub"
          new = "\tDim ID As Int\n\n\t'Android edge-to-edge safe content root\n\tDim root As Panel\n\tDim imeInsets As IME\n\t\n\t\nEnd Sub"
          assert old in s
          s = s.replace(old, new, 1)

          needle = "Sub Activity_Create (FirstTime As Boolean)\n\t'Do not forget to load the layout file created with the visual designer. For example:\n\t'Activity.LoadLayout(\"Layout1\")\n\n"
          assert needle in s
          s = s.replace(needle, needle + "\t'Keep the complete editor UI inside the system-bar-safe content area.\n\timeInsets.Initialize(\"imeInsets\")\n\troot.Initialize(\"\")\n\tDim Content As Rect = imeInsets.GetContentRect\n\tActivity.AddView(root, Content.Left, Content.Top, Content.Width, Content.Height)\n\timeInsets.UpdatePercentageReference(root.Width, root.Height)\n\tActivity.Color = Main.ColorPnlTitle\n\troot.Color = Main.ColorPnlInput1\n\n", 1)

          old = "\tpnlBack0.Initialize(\"\")\n\tpnlBack0.Color = Main.ColorPnlInput1\n    scvMain0.Initialize(100%y-(50dip*Main.sc))\n\tpnlBack0.AddView(scvMain0, 0, 0, 100%x, Activity.Height)"
          new = "\tpnlBack0.Initialize(\"\")\n\tpnlBack0.Color = Main.ColorPnlInput1\n\troot.AddView(pnlBack0, 0, 50dip*Main.sc, root.Width, root.Height-50dip*Main.sc)\n    scvMain0.Initialize(pnlBack0.Height)\n\tpnlBack0.AddView(scvMain0, 0, 0, pnlBack0.Width, pnlBack0.Height)"
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace("\n\tActivity.AddView(pnlBack0, 0, 50dip*Main.sc, 100%x, Activity.Height-50dip*Main.sc)\n\t", "\n\t", 1)

          replacements = {
              "Activity.AddView(pnltitle, 0, 0, 100%x, 50dip*Main.sc)": "root.AddView(pnltitle, 0, 0, root.Width, 50dip*Main.sc)",
              "pnltitle.AddView(pnlTransparent2,  50%x, 0, 50%x, 100%y)": "pnltitle.AddView(pnlTransparent2,  50%x, 0, 50%x, pnltitle.Height)",
              "pnltitle.AddView(pnlTransparent3,  0%x, 0, 50%x, 100%y)": "pnltitle.AddView(pnlTransparent3,  0%x, 0, 50%x, pnltitle.Height)",
              "pnltitle.AddView(paneldiv,  50%x, 0, 1dip, 100%y)": "pnltitle.AddView(paneldiv,  50%x, 0, 1dip, pnltitle.Height)",
              "(Activity.Width-edtCLmax1.Left-edtCLmax1.Width)-3%x": "(pnl5.Width-edtCLmax1.Left-edtCLmax1.Width)-3%x",
          }
          for a, b in replacements.items():
              assert a in s, a
              s = s.replace(a, b)
          airp.write_text(s, encoding="utf-8-sig")

          for path in (main, airp):
              text = path.read_text(encoding="utf-8-sig")
              leftovers = [line for line in text.splitlines() if ("Activity.Width" in line or "Activity.Height" in line or ("Activity.AddView" in line and "Activity.AddView(root," not in line))]
              assert not leftovers, (path, leftovers)
          assert "root.AddView(pager, 0, 102dip*sc, root.Width, root.Height-102dip*sc)" in main.read_text(encoding="utf-8-sig")

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AeroCalculator.b4a Airp.bas
          git commit -m "fix: respect system bar insets on Android 15 and 16"
          git push origin HEAD:release/3.22
