name: Web

on:
  push:
    branches:
      - main
      - feature/web-app
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:
    inputs:
      full_visual_audit:
        description: "Run the full screenshot audit across all configured viewports"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run browser checks
        run: npm run test:e2e
        env:
          AEROCALC_FULL_VISUAL_AUDIT: ${{ ((github.event_name == 'workflow_dispatch' && inputs.full_visual_audit) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-audit]'))) && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: aerocalculator-web
          path: web/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-visual-audit
          path: web/visual-audit
          if-no-files-found: ignore
